<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - MyCare</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
       integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Implementa o Js-->
    <script src="src/script.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <img src="imagens/banners/logo.png" alt="Logo MyCare">
        </div>

        <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="light" aria-label="Navegação principal">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                        <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                        <li class="nav-item">
                            <a class="nav-link active" href="carrinho.html">
                                Carrinho 
                                <span class="position-relative d-inline-block ms-1">
                                    <i class="bi bi-cart4 meu-carrinho-icon" style="font-size: 1.25rem;"></i>
                                    <span id="contador-carrinho"
                                        class="position-absolute top-0 start-100 translate-middle badge "
                                        style="font-size: 1rem;">
                                    </span>
                                </span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="mb-4">Seu Carrinho</h2>

        <div class="row g-4">
            <!-- Coluna da lista de produtos -->
            <div class="col-lg-8" id="lista-carrinho">
                <!-- Os cards dos produtos serão criados aqui via JavaScript -->
            </div>

            <!-- Coluna do resumo do pedido -->
            <div class="col-lg-4">
                <div class="card p-3 shadow-sm border-0 bg-light">
                    <h4>Resumo da Compra</h4>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Total de Itens:</span>
                        <strong id="resumo-quantidade">0</strong>
                    </div>
                    <div class="d-flex justify-content-between fs-5 mb-4">
                        <span>Valor Total:</span>
                        <strong id="preco-total" class="text-success">R$ 0,00</strong>
                    </div>
                    
                    <button id="btn-limpar" class="btn btn-outline-danger w-100 mb-2">
                        <i class="bi bi-trash"></i> Limpar Carrinho
                    </button>
                    <a href="comprar.html" class="btn btn-success w-100">Finalizar Pedido</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p><small>© 2026 MyCare. Todos os direitos reservados.</small></p>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Scripts do Carrinho -->
    <script src="src/script.js"></script>
    <script src="src/carrinho.js"></script>
</body>

</html>
