<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - MyCare</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
       integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<body>

    <header class="cabecalho">
        <div class="logo">
            <img src="imagens/banners/logo.png" alt="Logo MyCare">
        </div>
            <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="light" aria-label="Navegação principal">
                <div class="container-fluid">
                
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                        aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menu">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="index.html">Home </a></li>
                            <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos </a></li>
                            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contato.html">Contato </a></li>
                        
                            <li class="nav-item">
                                <a class="nav-link" href="carrinho.html">Carrinho <i class="bi bi-cart4 meu-carrinho-icon"></i></a>
                            </li>
                        </ul>
                    </div>
                </div>
        </nav>
    </header>

    <main>
        <section class="secao-contato">
            <h1>Entre em Contato</h1>
            <p>Estamos aqui para ajudar! Preencha o formulário abaixo e entraremos em contato com você em breve.</p>

            <form action="#" method="post" class="form-contato">
                <div class="campo-form">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-form">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo-form">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(xx) xxxx-xxxx">
                </div>

                <div class="campo-form">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem" required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p><small>© 2026 MyCare. Todos os direitos reservados.</small></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
